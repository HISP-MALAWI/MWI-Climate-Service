# Malawi's 28 districts from Overture Maps. Overture tags the districts and many traditional
# authorities in Malawi as the same `county` subtype and admin level, so no subtype filter
# separates them; the districts are selected by Overture id instead. Where a district name
# appears twice, the id is the district-sized polygon (the other is a 2-12 km2 area).
# The ids belong to the pinned release; check them when bumping `release`.
#
# LICENCE: ODbL (OpenStreetMap). Keep `license` and `attribution`.
