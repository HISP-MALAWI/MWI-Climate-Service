# Spell hazard datasets served by the hazard grid API.
# Source: http://168.253.224.247:8000/grid/spells?variable=<hazard>_<metric>
# Generated: 3 hazards x 6 metrics = 18 templates.

- id: dry_spell_total_spell_days
  name: Dry spell total spell days
  short_name: Dry spell total spell days
  variable: dry_spell_total_spell_days
  description: Total number of days spent inside dry spells (consecutive dry days).
  temporal_direction: future
  period_type: daily
  sync:
    kind: temporal
    execution: append
  ingestion:
    plugin: datasets.spell_hazards.SpellHazardPlugin
    resampling: mean
    params:
      base_url: http://168.253.224.247:8000
      source_variable: dry_spell_total_spell_days
  units: "d"
  source: Spell hazard grid API
  source_url: http://168.253.224.247:8000/grid/spells
  display:
    colormap: ylorbr

