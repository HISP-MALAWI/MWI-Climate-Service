- id: tmin_forecast_daily
  name: Minimum Temperature (Daily Forecast)
  short_name: Min Temp
  variable: tmin
  period_type: daily
  sync:
    kind: temporal
  extents:
    temporal:
      begin: "2026-08-05"
      resolution: P1D
  ingestion:
    plugin: datasets.daily_forecast.DailyForecastPlugin
    params:
      base_url: "http://168.253.224.247:8000/"
      dataset: "tmin"
      max_forecast_days: 7
  units: "°C"
  cf_attributes:
    units: "°C"
  resolution: 0.0629° × 0.0645° (~7 km)
  source: Department of Climate change and meteological services.
  source_url: "https://www.metmalawi.gov.mw/"
  display:
    colormap: CoolWarm
    range: [-10, 40]

