- id: enacts_precip_daily
  name: Precipitation (ENACTS)
  short_name: Rainfall
  variable: precip
  period_type: daily
  sync:
    kind: temporal
  extents:
    temporal:
      begin: "1981-01-01"
      end: "2026-12-31"
      resolution: P1D
  ingestion:
    plugin: datasets.enacts_precip.EnactsPrecipPlugin
    params:
      base_url: "http://168.253.224.242:9091/dst"
      dataset: "MON"
  units: "mm"
  cf_attributes:
    units: "mm"
  resolution: 0.05° × 0.05° (~5 km)
  source: Department of Climate Change and Meteorological Services.
  display:
    colormap: Blues
    range: [0, 50]