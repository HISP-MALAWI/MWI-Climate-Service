- id: access_esm_ssp126_tavg
  name: Mean Temperature – ACCESS-ESM1-5 SSP1-2.6
  short_name: Mean Temp
  variable: tavg
  period_type: daily
  sync:
    kind: static
  extents:
    temporal:
      begin: "1970-01-02"
      end: "2101-01-03"
      resolution: P1D
  ingestion:
    plugin: datasets.access_esm_ssp126.AccessEsmSsp126Plugin
    params:
      file_path: ./data/ACCESS-ESM1-5_ssp126/tavg.nc
      variable: tavg
  units: "°C"
  resolution: 0.5° × 0.5° (~55 km)
  source: ACCESS-ESM1-5, SSP1-2.6 scenario
  display:
    colormap: RdYlBu_r
    range: [10, 35]

