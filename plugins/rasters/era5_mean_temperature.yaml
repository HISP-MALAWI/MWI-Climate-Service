- id: era5_mean_temperature_daily
  name: Mean Temperature (ERA5-Land)
  short_name: Mean Temp
  variable: tmean
  period_type: daily
  sync:
    kind: temporal
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "1950-01-01"
      resolution: P1D
  ingestion:
    plugin: rasters.era5_mean_temperature.Era5MeanTemperaturePlugin
  units: "degC"
  cf_attributes:
    units: "degC"
    standard_name: air_temperature
    cell_methods: "time: mean"
  resolution: 0.1° × 0.1°
  source: ERA5-Land via DestinE Earth Data Hub
  source_url: https://earthdatahub.destine.eu/collections/era5/datasets/era5-land
  display:
    colormap: RdYlBu_r
    range: [10, 35]
